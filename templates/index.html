{% extends "base.html" %}
{% block content %}
<section class="landing-hero">
  <div class="landing-bg" aria-hidden="true"></div>
  <div class="landing-content">
    <div class="brand-badge">
      <img src="{{ url_for('static', filename='toolkit-logo.png') }}" alt="">
      Toolkit Africa
    </div>
    <h1>Welcome to<br>Toolkit Africa Reports.</h1>
    <p class="lead">Internal reporting platform for Toolkit Africa staff. Sign in to continue.</p>
    <div class="landing-actions">
      <a class="primary" href="{{ url_for('login') }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign in
      </a>
      {% if registration_open %}
      <a class="secondary" href="{{ url_for('register') }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Create account
      </a>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
