<!doctype html><html><head><title>Wingu Test Timesheet</title></head><body>
<form id="timesheet" method="post" action="/timesheet/update">
  <label for="employee">Employee</label><select id="employee" name="employee"><option value="42">Test Employee</option></select>
  <label for="project">Project</label><select id="project" name="project"><option value="tti-live">Toolkit Project</option></select>
  <label for="start">Start time</label><input id="start" name="start_time" value="DO_NOT_CAPTURE_START">
  <label for="notes">Notes</label><textarea id="notes" name="notes">DO_NOT_CAPTURE_NOTES</textarea>
  <input type="password" name="password" value="DO_NOT_CAPTURE_PASSWORD">
  <button type="submit">Update Time Sheet</button>
</form></body></html>
